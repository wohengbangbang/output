name: Generate Snake

on:
  schedule:
    # 每12小时自动更新一次
    - cron: "0 */12 * * *"

  # 支持手动运行
  workflow_dispatch:


jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          # 自动读取你的GitHub用户名
          github_user_name: wohengbangbang

          # 生成文件
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark


      # 将生成的文件推送到output仓库
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
